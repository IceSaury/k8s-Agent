name: CI

# 这条流水线只验证「代码能装、能编译、能导入、没有错误级 lint」，不需要任何密钥，
# 所以 fork 之后也能直接跑通。真正的端到端（连 K8s MCP Server、调大模型、连飞书）
# 依赖本地虚拟机上的服务，公共 runner 上没有，不在这里跑。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: >-
          python -m compileall -q
          agent.py cli.py config.py console_boot.py prompts.py tools feishu

      - name: 导入冒烟测试
        run: python -c "import config, prompts, agent, tools.search, tools.mock_k8s"

      - name: 静态检查（错误级规则 E9/F）
        run: >-
          ruff check --select E9,F
          agent.py cli.py config.py console_boot.py prompts.py tools feishu
